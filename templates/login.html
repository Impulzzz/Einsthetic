{% extends "base.html" %}

{% block title %}Login - Einsthetic{% endblock %}

{% block content %}
<!-- Background -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 -left-20 w-96 h-96 bg-accent-500/5 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-purple-500/5 rounded-full blur-3xl"></div>
</div>

<div class="relative flex items-center justify-center min-h-[85vh] px-6">
    <div class="w-full max-w-md">
        <!-- Card Header -->
        <div class="text-center mb-8 animate-slide-up">
            <h1 class="text-4xl font-display font-bold text-white mb-3">
                Welcome <span class="gradient-text">Back</span>
            </h1>
            <p class="text-gray-400">Sign in to continue your GATE preparation journey</p>
        </div>

        <!-- Login Card -->
        <div class="glass border border-gray-800 rounded-3xl p-8 shadow-2xl animate-slide-up"
            style="animation-delay: 0.1s;">
            <form id="login-form" class="space-y-5">
                <!-- Email Input -->
                <div class="space-y-2">
                    <label class="block text-gray-300 text-sm font-semibold" for="email">
                        Email Address
                    </label>
                    <input
                        class="w-full bg-dark-900/50 border border-gray-700 rounded-xl py-3.5 px-4 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-accent-500 focus:border-transparent transition-all"
                        id="email" type="email" placeholder="student@example.com" required>
                </div>

                <!-- Password Input -->
                <div class="space-y-2">
                    <label class="block text-gray-300 text-sm font-semibold" for="password">
                        Password
                    </label>
                    <input
                        class="w-full bg-dark-900/50 border border-gray-700 rounded-xl py-3.5 px-4 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-accent-500 focus:border-transparent transition-all"
                        id="password" type="password" placeholder="••••••••" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="group relative w-full mt-6">
                    <div
                        class="absolute inset-0 bg-gradient-to-r from-accent-500 to-purple-500 rounded-xl blur opacity-75 group-hover:opacity-100 transition">
                    </div>
                    <div
                        class="relative bg-gradient-to-r from-accent-600 to-purple-600 rounded-xl py-3.5 text-white font-bold hover:from-accent-500 hover:to-purple-500 transition-all">
                        Sign In
                    </div>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-800"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 glass text-gray-400">Or continue with</span>
                </div>
            </div>

            <!-- Google Login -->
            <button id="google-login-btn"
                class="w-full bg-white hover:bg-gray-50 text-gray-900 py-3.5 rounded-xl font-semibold flex items-center justify-center gap-3 transition-all hover:shadow-lg">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="h-5 w-5" alt="Google">
                Sign in with Google
            </button>
        </div>

        <!-- Footer Links -->
        <div class="mt-6 text-center animate-slide-up" style="animation-delay: 0.2s;">
            <p class="text-gray-400 text-sm">
                Don't have an account?
                <a href="/signup"
                    class="text-accent-400 hover:text-accent-300 transition-colors font-semibold ml-1">Create
                    Account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const provider = new firebase.auth.GoogleAuthProvider();

    async function handleSessionLogin(user) {
        const idToken = await user.getIdToken();
        const res = await fetch('/api/session_login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ idToken: idToken })
        });
        if (res.ok) {
            window.location.href = '/dashboard';
        } else {
            console.error("Session login failed");
            alert("Login failed. Please try again.");
        }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        try {
            const result = await firebase.auth().signInWithEmailAndPassword(email, password);
            await handleSessionLogin(result.user);
        } catch (error) {
            alert("Login Error: " + error.message);
        }
    });

    document.getElementById('google-login-btn').addEventListener('click', () => {
        firebase.auth().signInWithPopup(provider)
            .then((result) => {
                handleSessionLogin(result.user);
            }).catch((error) => {
                console.error("Login failed:", error);
                alert("Login Error: " + error.message);
            });
    });
</script>
{% endblock %}
