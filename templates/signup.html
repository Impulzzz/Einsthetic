{% extends "base.html" %}

{% block title %}Sign Up - Einsthetic{% endblock %}

{% block content %}
<div class="flex items-center justify-center h-[80vh]">
    <div
        class="bg-dark-800 p-8 rounded-2xl shadow-2xl border border-gray-700 w-full max-w-md backdrop-blur-sm bg-opacity-90">
        <h1 class="text-3xl font-bold mb-2 text-center text-white">Join Einsthetic</h1>
        <p class="text-gray-400 mb-8 text-center">Create your account to track GATE progress.</p>

        <form id="signup-form" class="space-y-4">
            <div>
                <label class="block text-gray-300 text-sm font-bold mb-2" for="email">Email</label>
                <input
                    class="w-full bg-dark-900 border border-dark-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-accent-500"
                    id="email" type="email" placeholder="student@example.com" required>
            </div>
            <div>
                <label class="block text-gray-300 text-sm font-bold mb-2" for="password">Password</label>
                <input
                    class="w-full bg-dark-900 border border-dark-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-accent-500"
                    id="password" type="password" placeholder="••••••••" required>
            </div>
            <div>
                <label class="block text-gray-300 text-sm font-bold mb-2" for="confirm-password">Confirm
                    Password</label>
                <input
                    class="w-full bg-dark-900 border border-dark-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-accent-500"
                    id="confirm-password" type="password" placeholder="••••••••" required>
            </div>

            <button type="submit"
                class="w-full bg-accent-500 hover:bg-accent-400 text-white font-bold py-3 rounded-lg transition-all shadow-lg shadow-accent-500/20">
                Sign Up
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-400 text-sm">
                Already have an account?
                <a href="/login" class="text-accent-400 hover:text-white transition-colors font-semibold">Log In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        try {
            const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
            const user = userCredential.user;

            // Get ID Token
            const idToken = await user.getIdToken();

            // Create Session on Backend
            const res = await fetch('/api/session_login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken: idToken })
            });

            if (res.ok) {
                window.location.href = '/dashboard';
            } else {
                alert("Session creation failed.");
            }
        } catch (error) {
            console.error("Signup Error:", error);
            alert("Error: " + error.message);
        }
    });
</script>
{% endblock %}
