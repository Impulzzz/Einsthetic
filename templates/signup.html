{% extends "base.html" %}

{% block title %}Sign Up - Einsthetic{% endblock %}

{% block content %}
<div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 -left-20 w-96 h-96 bg-purple-500/5 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-accent-500/5 rounded-full blur-3xl"></div>
</div>

<div class="relative flex items-center justify-center min-h-[85vh] px-6">
    <div class="w-full max-w-md">
        <div class="text-center mb-8 animate-slide-up">
            <h1 class="text-4xl font-display font-bold text-white mb-3">
                Join <span class="gradient-text">Einsthetic</span>
            </h1>
            <p class="text-gray-400">Start your GATE CS preparation journey today</p>
        </div>

        <div class="glass border border-gray-800 rounded-3xl p-8 shadow-2xl animate-slide-up"
            style="animation-delay: 0.1s;">
            <form id="signup-form" class="space-y-5">
                <div class="space-y-2">
                    <label class="block text-gray-300 text-sm font-semibold" for="email">Email Address</label>
                    <input
                        class="w-full bg-dark-900/50 border border-gray-700 rounded-xl py-3.5 px-4 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-accent-500 focus:border-transparent transition-all"
                        id="email" type="email" placeholder="student@example.com" required>
                </div>

                <div class="space-y-2">
                    <label class="block text-gray-300 text-sm font-semibold" for="password">Password</label>
                    <input
                        class="w-full bg-dark-900/50 border border-gray-700 rounded-xl py-3.5 px-4 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-accent-500 focus:border-transparent transition-all"
                        id="password" type="password" placeholder="••••••••" required>
                </div>

                <div class="space-y-2">
                    <label class="block text-gray-300 text-sm font-semibold" for="confirm-password">Confirm
                        Password</label>
                    <input
                        class="w-full bg-dark-900/50 border border-gray-700 rounded-xl py-3.5 px-4 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-accent-500 focus:border-transparent transition-all"
                        id="confirm-password" type="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="group relative w-full mt-6">
                    <div
                        class="absolute inset-0 bg-gradient-to-r from-accent-500 to-purple-500 rounded-xl blur opacity-75 group-hover:opacity-100 transition">
                    </div>
                    <div
                        class="relative bg-gradient-to-r from-accent-600 to-purple-600 rounded-xl py-3.5 text-white font-bold hover:from-accent-500 hover:to-purple-500 transition-all">
                        Create Account
                    </div>
                </button>
            </form>
        </div>

        <div class="mt-6 text-center animate-slide-up" style="animation-delay: 0.2s;">
            <p class="text-gray-400 text-sm">
                Already have an account?
                <a href="/login" class="text-accent-400 hover:text-accent-300 transition-colors font-semibold ml-1">Sign
                    In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        try {
            const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
            const user = userCredential.user;
            const idToken = await user.getIdToken();

            const res = await fetch('/api/session_login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken: idToken })
            });

            if (res.ok) {
                window.location.href = '/dashboard';
            } else {
                alert("Session creation failed.");
            }
        } catch (error) {
            console.error("Signup Error:", error);
            alert("Error: " + error.message);
        }
    });
</script>
{% endblock %}
